name: Bug report
description: Report a correctness, soundness, or usability bug
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** report suspected soundness or memory-safety vulnerabilities
        here. Follow SECURITY.md and email futureproofs@proton.me privately.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, parameters, proof bytes, or a minimal test case.
      placeholder: |
        cargo test ...
        # or a short Rust snippet
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a git commit hash
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - fields
        - hash / merkle
        - ntt / fri / upcs
        - air / range / table / fold / vm
        - codec / wire format
        - docs / tooling
        - other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, Rust version, features (for example `simd`).
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This is not a private security report.
          required: true
        - label: I searched existing issues first.
          required: true
