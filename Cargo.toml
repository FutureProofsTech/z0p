[package]
name = "z0p"
version = "0.2.1"
edition = "2021"
description = "From-scratch zero-knowledge core: binary fields, BLAKE3, Merkle, NTT, FRI, STARKs. Zero dependencies, no unsafe, no trusted setup."
license = "GPL-3.0-only"
repository = "https://github.com/FutureProofsTech/z0p"
homepage = "https://github.com/FutureProofsTech/z0p"
readme = "README.md"
keywords = ["zero-knowledge", "fri", "stark", "cryptography", "blake3"]
categories = ["cryptography"]
rust-version = "1.74"

[features]
default = []
# 8-lane portable-SIMD BLAKE3 for Merkle leaf/node batches. `std::simd` is
# unstable on Rust 1.99, so this feature needs a nightly toolchain; the
# default build stays scalar and MSRV 1.74. Outputs are byte-identical to
# the scalar path (pinned by tests under `--features simd`).
simd = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bench]]
name = "speed_size"
harness = false
