name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt / clippy / test (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (stable) with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (pedantic, deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (debug)
        run: cargo test
      - name: Test (release)
        run: cargo test --release

  msrv:
    name: MSRV 1.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.74
        uses: dtolnay/rust-toolchain@1.74.0
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test --lib

  simd:
    name: portable SIMD (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (nightly) with clippy
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Clippy (--features simd)
        run: cargo clippy --all-targets --features simd -- -D warnings
      - name: Test (--features simd)
        run: cargo test --features simd

  release:
    name: release metadata (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check version, changelog, and tag
        run: python3 tools/release_check.py "$GITHUB_REF_NAME"

  docs:
    name: rustdoc (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check Markdown links
        run: python3 tools/check_links.py
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
